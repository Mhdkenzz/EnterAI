[alembic]
script_location = alembic
# env.py imports the app package, so the backend directory has to be importable.
# Without this every caller has to remember PYTHONPATH=., and the one that did not
# -- the container image's own migrate command -- failed at startup.
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://enterai:enterai_dev_password@db:5432/enterai
[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
