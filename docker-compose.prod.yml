# Production-shaped stack: images only (no source bind mounts), two API replicas
# behind a load balancer, shared PostgreSQL / Redis / object storage, and schema
# migration as a one-shot release step rather than something every replica races
# to run at boot.
#
# Images are supplied by the guarded release workflow as immutable digest
# references.  This file intentionally has no `build:` entries: a host must
# never rebuild an unreviewed working tree during deployment.
#
# Every secret below has no default on purpose: this file must not be startable
# with credentials that are published in this repository.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
    volumes: [minio_data:/data]

  # Creates the bucket once, then exits; the replicas wait for it to finish.
  # Readiness is decided by this retry loop rather than a healthcheck on the
  # server, because `mc` is guaranteed present here and the server image's tooling
  # is not.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
    entrypoint: >-
      sh -c "until mc alias set local http://minio:9000 $$STORAGE_ACCESS_KEY $$STORAGE_SECRET_KEY;
             do echo 'waiting for minio'; sleep 2; done &&
             mc mb --ignore-existing local/$$STORAGE_BUCKET"

  # Runs once and exits. Replicas wait for it rather than each running migrations
  # at boot, which two of them would otherwise do concurrently on one database.
  migrate:
    image: ${ENTERAI_BACKEND_IMAGE:?set ENTERAI_BACKEND_IMAGE to an immutable image digest}
    command: ["sh", "-ec", "alembic upgrade head && alembic current --check"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      db: {condition: service_healthy}

  api:
    image: ${ENTERAI_BACKEND_IMAGE:?set ENTERAI_BACKEND_IMAGE to an immutable image digest}
    restart: unless-stopped
    # No bind mount: the image is the artifact. Mounting ./backend over /app would
    # ship whatever happens to be in the working tree instead of what was built,
    # and would put a writable source tree inside a production container.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT to staging or production}
      ENABLE_API_DOCS: "false"
      ENABLE_DEMO_SEED: "false"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?set EMAIL_PROVIDER}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      # Only required for OIDC login (Phase 14.2): the redirect_uri registered
      # with an IdP must resolve to this backend, not the frontend/APP_BASE_URL.
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL}
      # Only required once an OIDC identity provider's client_secret is stored
      # (app/secrets_store.py fails closed in production if unset and one is).
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SECRETS_ENCRYPTION_KEY_PREVIOUS: ${SECRETS_ENCRYPTION_KEY_PREVIOUS:-}
      # The API only ever sees the load balancer's address, so rate limiting has to
      # read the client from the header nginx appends.
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?set TRUSTED_HOSTS}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
      AI_PLAN_RATE_LIMIT_PER_MINUTE: ${AI_PLAN_RATE_LIMIT_PER_MINUTE:-20}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "1.0", memory: 768M}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  # Runs scripts/backup.sh on a loop rather than only documenting it -- a runbook
  # nobody's cron actually calls is not a backup strategy. Not wired into `lb`'s
  # dependency chain, so `docker compose up -d --build lb` (what CI's multi-replica
  # job runs) never starts it; a real deployment brings it up with `docker compose
  # up -d` (no target) to include everything.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BACKUP_DIR: /var/backups/enterai
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_OFFSITE_HOOK: ${BACKUP_OFFSITE_HOOK:-}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backup_data:/var/backups/enterai
    entrypoint: >-
      sh -c "while true; do sh /backup.sh || echo 'backup run failed, retrying next interval'; sleep \"$$BACKUP_INTERVAL_SECONDS\"; done"
    depends_on:
      db: {condition: service_healthy}

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:?set TLS_CERT_PATH}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_KEY_PATH:?set TLS_KEY_PATH}:/etc/nginx/tls/tls.key:ro
    depends_on: [api]

  web:
    image: ${ENTERAI_FRONTEND_IMAGE:?set ENTERAI_FRONTEND_IMAGE to an immutable image digest}
    restart: unless-stopped
    depends_on: [lb]

volumes:
  postgres_data:
  minio_data:
  backup_data:
