# Production-shaped stack: images only (no source bind mounts), two API replicas
# behind a load balancer, shared PostgreSQL / Redis / object storage, and schema
# migration as a one-shot release step rather than something every replica races
# to run at boot.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Every secret below has no default on purpose: this file must not be startable
# with credentials that are published in this repository.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
    volumes: [minio_data:/data]

  # Creates the bucket once, then exits; the replicas wait for it to finish.
  # Readiness is decided by this retry loop rather than a healthcheck on the
  # server, because `mc` is guaranteed present here and the server image's tooling
  # is not.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
    entrypoint: >-
      sh -c "until mc alias set local http://minio:9000 $$STORAGE_ACCESS_KEY $$STORAGE_SECRET_KEY;
             do echo 'waiting for minio'; sleep 2; done &&
             mc mb --ignore-existing local/$$STORAGE_BUCKET"

  # Runs once and exits. Replicas wait for it rather than each running migrations
  # at boot, which two of them would otherwise do concurrently on one database.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ./backend
    restart: unless-stopped
    # No bind mount: the image is the artifact. Mounting ./backend over /app would
    # ship whatever happens to be in the working tree instead of what was built,
    # and would put a writable source tree inside a production container.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: production
      ENABLE_API_DOCS: "false"
      ENABLE_DEMO_SEED: "false"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
      AI_PLAN_RATE_LIMIT_PER_MINUTE: ${AI_PLAN_RATE_LIMIT_PER_MINUTE:-20}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "1.0", memory: 768M}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8000:8000"]
    volumes: [./deploy/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [api]

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports: ["3000:3000"]
    depends_on: [lb]

volumes:
  postgres_data:
  minio_data:
