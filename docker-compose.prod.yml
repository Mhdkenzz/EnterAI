# Production-shaped stack: images only (no source bind mounts), two API replicas
# behind a load balancer, shared PostgreSQL / Redis / object storage, and schema
# migration as a one-shot release step rather than something every replica races
# to run at boot.
#
# Images are supplied by the guarded release workflow as immutable digest
# references.  This file intentionally has no `build:` entries: a host must
# never rebuild an unreviewed working tree during deployment.
#
# Every secret below has no default on purpose: this file must not be startable
# with credentials that are published in this repository.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Self-hosted S3-compatible storage (Versity S3 Gateway over a local directory).
  # MinIO's images stopped being publicly pullable in September 2026. For a hosted
  # SaaS, prefer managed object storage (S3, R2, GCS): point STORAGE_ENDPOINT_URL at
  # it and this service simply goes unused.
  objectstore:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    restart: unless-stopped
    command: ["--port", ":9000", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      ROOT_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
    volumes: [objectstore_data:/data]

  # Creates the bucket once, then exits; the replicas wait for it to finish. Uses
  # the backend image the replicas already run, so no separate client image.
  objectstore-init:
    image: ${ENTERAI_BACKEND_IMAGE:?set ENTERAI_BACKEND_IMAGE to an immutable image digest}
    command: ["python", "-m", "app.ensure_bucket"]
    depends_on: [objectstore]
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://objectstore:9000}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}

  # Runs once and exits. Replicas wait for it rather than each running migrations
  # at boot, which two of them would otherwise do concurrently on one database.
  migrate:
    image: ${ENTERAI_BACKEND_IMAGE:?set ENTERAI_BACKEND_IMAGE to an immutable image digest}
    command: ["sh", "-ec", "alembic upgrade head && current=\"$$(alembic current)\" && heads=\"$$(alembic heads)\" && test \"$$current\" = \"$$heads\""]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      db: {condition: service_healthy}

  api:
    image: ${ENTERAI_BACKEND_IMAGE:?set ENTERAI_BACKEND_IMAGE to an immutable image digest}
    restart: unless-stopped
    # No bind mount: the image is the artifact. Mounting ./backend over /app would
    # ship whatever happens to be in the working tree instead of what was built,
    # and would put a writable source tree inside a production container.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT to staging or production}
      ENABLE_API_DOCS: "false"
      ENABLE_DEMO_SEED: "false"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?set EMAIL_PROVIDER}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      # Only required for OIDC login (Phase 14.2): the redirect_uri registered
      # with an IdP must resolve to this backend, not the frontend/APP_BASE_URL.
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL}
      ENTER_AI_BROWSER_APP_URL: ${ENTER_AI_BROWSER_APP_URL:-${APP_BASE_URL}}
      ENTER_AI_BROWSER_API_URL: ${ENTER_AI_BROWSER_API_URL:-${API_BASE_URL}/api}
      AGENT_EXECUTION_DAILY_STEP_LIMIT: ${AGENT_EXECUTION_DAILY_STEP_LIMIT:-500}
      AGENT_WORKSPACE_ROOT: /var/lib/enterai/workspaces
      # Required whenever OIDC or a mailbox/workspace OAuth integration is enabled.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SECRETS_ENCRYPTION_KEY_PREVIOUS: ${SECRETS_ENCRYPTION_KEY_PREVIOUS:-}
      # Optional provider app credentials. Configure the redirect URLs against
      # API_BASE_URL; the integrations UI reports which connectors are available.
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
      GMAIL_SYNC_INTERVAL_SECONDS: ${GMAIL_SYNC_INTERVAL_SECONDS:-30}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      # The API only ever sees the load balancer's address, so rate limiting has to
      # read the client from the header nginx appends.
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?set TRUSTED_HOSTS}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://objectstore:9000}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BILLING_PLANS: ${BILLING_PLANS:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "1.0", memory: 768M}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      objectstore-init: {condition: service_completed_successfully}
    volumes:
      - ${AGENT_WORKSPACE_HOST_PATH:-/srv/enterai/workspaces}:/var/lib/enterai/workspaces

  # Runs scripts/backup.sh on a loop to create and verify PostgreSQL archives.
  # The release workflow starts this and both remote backup workers explicitly.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    # A fresh named volume is root-owned. This isolated job needs write access to
    # its archive volume; the off-site worker mounts that volume read-only.
    user: "0:0"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BACKUP_DIR: /var/backups/enterai
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_OFFSITE_HOOK: ${BACKUP_OFFSITE_HOOK:-}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backup_data:/var/backups/enterai
    entrypoint: >-
      sh -c "while true; do sh /backup.sh || echo 'backup run failed, retrying next interval'; sleep \"$$BACKUP_INTERVAL_SECONDS\"; done"
    depends_on:
      db: {condition: service_healthy}

  # Mirrors uploaded files to a separate backup bucket. Configure destination
  # versioning/lifecycle there for recoverability and retention.
  objectstore-backup:
    image: ${ENTERAI_BACKEND_IMAGE:?set ENTERAI_BACKEND_IMAGE to an immutable image digest}
    restart: unless-stopped
    command: ["python", "-m", "app.backup_objects", "--loop"]
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://objectstore:9000}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
      BACKUP_OBJECTS_BUCKET: ${BACKUP_OBJECTS_BUCKET:?set BACKUP_OBJECTS_BUCKET}
      DATABASE_BACKUP_BUCKET: ${DATABASE_BACKUP_BUCKET:?set DATABASE_BACKUP_BUCKET}
      BACKUP_OBJECTS_ENDPOINT_URL: ${BACKUP_OBJECTS_ENDPOINT_URL:-}
      BACKUP_OBJECTS_REGION: ${BACKUP_OBJECTS_REGION:-us-east-1}
      BACKUP_OBJECTS_ACCESS_KEY: ${BACKUP_OBJECTS_ACCESS_KEY:-}
      BACKUP_OBJECTS_SECRET_KEY: ${BACKUP_OBJECTS_SECRET_KEY:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      objectstore-init: {condition: service_completed_successfully}

  # Copies verified pg_dump archives to a dedicated off-host bucket. Keep this
  # bucket separate from BACKUP_OBJECTS_BUCKET because the upload mirror prunes
  # keys deleted from the primary uploads bucket.
  database-backup-offsite:
    image: ${ENTERAI_BACKEND_IMAGE:?set ENTERAI_BACKEND_IMAGE to an immutable image digest}
    restart: unless-stopped
    command: ["python", "-m", "app.backup_database", "--loop"]
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
      DATABASE_BACKUP_BUCKET: ${DATABASE_BACKUP_BUCKET:?set DATABASE_BACKUP_BUCKET}
      BACKUP_OBJECTS_BUCKET: ${BACKUP_OBJECTS_BUCKET:?set BACKUP_OBJECTS_BUCKET}
      DATABASE_BACKUP_ENDPOINT_URL: ${DATABASE_BACKUP_ENDPOINT_URL:-}
      DATABASE_BACKUP_REGION: ${DATABASE_BACKUP_REGION:-us-east-1}
      DATABASE_BACKUP_ACCESS_KEY: ${DATABASE_BACKUP_ACCESS_KEY:-}
      DATABASE_BACKUP_SECRET_KEY: ${DATABASE_BACKUP_SECRET_KEY:-}
      BACKUP_DIR: /var/backups/enterai
      DATABASE_BACKUP_SYNC_INTERVAL_SECONDS: ${DATABASE_BACKUP_SYNC_INTERVAL_SECONDS:-300}
    volumes:
      - backup_data:/var/backups/enterai:ro
    depends_on:
      backup: {condition: service_started}

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:?set TLS_CERT_PATH}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_KEY_PATH:?set TLS_KEY_PATH}:/etc/nginx/tls/tls.key:ro
    depends_on: [api, web]

  web:
    image: ${ENTERAI_FRONTEND_IMAGE:?set ENTERAI_FRONTEND_IMAGE to an immutable image digest}
    restart: unless-stopped

volumes:
  postgres_data:
  objectstore_data:
  backup_data:
