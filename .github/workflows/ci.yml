name: Enter AI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
        env:
          DATABASE_URL: sqlite:///./ci.db
          JWT_SECRET: ci-only-secret
      - run: PYTHONPATH=. alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          ENVIRONMENT=ci ENABLE_API_DOCS=false DATABASE_URL=sqlite:///./ci.db JWT_SECRET=ci-only-secret PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/enter-ai-api.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Start web
        working-directory: frontend
        run: NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/enter-ai-web.log 2>&1 &
      - name: Wait for web
        run: for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3000 && break || sleep 1; done
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright and axe tests
        working-directory: frontend
        run: npm run test:e2e

  api-security-and-load:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install schemathesis==4.27.2 --upgrade pytest
          ENVIRONMENT=ci ENABLE_API_DOCS=true DATABASE_URL=sqlite:///./ci.db JWT_SECRET=ci-only-secret PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/enter-ai-api.log 2>&1 &
          echo $! > /tmp/enter-ai-api.pid
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
      - name: Schemathesis
        run: schemathesis run http://127.0.0.1:8000/openapi.json --checks all --exclude-checks allow_header_conformance,positive_data_acceptance --phases examples,coverage,fuzzing
      - uses: grafana/setup-k6-action@v1
      - name: K6 smoke
        run: k6 run qa/k6/smoke.js
      - name: Restart API with production docs policy for ZAP
        working-directory: backend
        run: |
          kill "$(cat /tmp/enter-ai-api.pid)"
          for attempt in $(seq 1 30); do ! curl -sS http://127.0.0.1:8000/health >/dev/null 2>&1 && break || sleep 1; done
          ENVIRONMENT=production ENABLE_API_DOCS=false DATABASE_URL=sqlite:///./ci.db JWT_SECRET=ci-only-secret PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/enter-ai-api-zap.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8000/
          cmd_options: -c /zap/wrk/qa/zap-rules.conf
          fail_action: true
          allow_issue_writing: false

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: EnterAI
          path: .
          format: HTML
          args: --failOnCVSS 7
