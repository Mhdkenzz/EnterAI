name: Enter AI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
          JWT_SECRET: ci-only-secret
      - run: PYTHONPATH=. pytest -q
        env:
          DATABASE_URL: sqlite:///./ci.db
          JWT_SECRET: ci-only-secret
      - run: PYTHONPATH=. alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db

  # SQLite silently ignores foreign keys, so it cannot prove the schema or the
  # endpoints are correct on the database production actually runs. This job is a
  # required gate, not an optional extra.
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enterai_ci
          POSTGRES_USER: enterai
          POSTGRES_PASSWORD: enterai_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enterai -d enterai_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Real Redis, so the sliding-window Lua script is proven against the server
      # it will actually run on rather than only against the fakeredis emulator.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://enterai:enterai_ci_password@127.0.0.1:5432/enterai_ci
      JWT_SECRET: ci-only-secret
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Migration chain round trips on PostgreSQL
        run: |
          PYTHONPATH=. alembic upgrade head
          PYTHONPATH=. alembic downgrade base
          PYTHONPATH=. alembic upgrade head
      - run: PYTHONPATH=. pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          # Startup no longer creates schema; migrate the same disposable database.
          DATABASE_URL=sqlite:////tmp/enter-ai-browser-ci.db PYTHONPATH=. alembic upgrade head
          ENVIRONMENT=ci ENABLE_API_DOCS=false DATABASE_URL=sqlite:////tmp/enter-ai-browser-ci.db JWT_SECRET=ci-only-secret AUTH_LOGIN_RATE_LIMIT_PER_MINUTE=100000 AUTH_SIGNUP_RATE_LIMIT_PER_MINUTE=100000 AUTH_RECOVERY_RATE_LIMIT_PER_MINUTE=100000 AUTH_TOKEN_RATE_LIMIT_PER_MINUTE=100000 PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/enter-ai-api.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Start web
        working-directory: frontend
        run: NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/enter-ai-web.log 2>&1 &
      - name: Wait for web
        run: for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3000 && break || sleep 1; done
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright and axe tests
        working-directory: frontend
        env:
          E2E_DATABASE_URL: sqlite:////tmp/enter-ai-browser-ci.db
          E2E_PYTHON: python
        run: npm run test:e2e

  api-security-and-load:
    runs-on: ubuntu-latest
    needs: backend
    services:
      # The ZAP pass below boots the API in production mode, which fails closed
      # without a reachable Redis for shared rate limits.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install schemathesis==4.27.2 --upgrade pytest
          DATABASE_URL=sqlite:///./ci.db PYTHONPATH=. alembic upgrade head
          ENVIRONMENT=ci ENABLE_API_DOCS=true DATABASE_URL=sqlite:///./ci.db JWT_SECRET=ci-only-secret AUTH_LOGIN_RATE_LIMIT_PER_MINUTE=100000 AUTH_SIGNUP_RATE_LIMIT_PER_MINUTE=100000 AUTH_RECOVERY_RATE_LIMIT_PER_MINUTE=100000 AUTH_TOKEN_RATE_LIMIT_PER_MINUTE=100000 PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/enter-ai-api.log 2>&1 &
          echo $! > /tmp/enter-ai-api.pid
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
      - name: Schemathesis
        run: schemathesis run http://127.0.0.1:8000/openapi.json --checks all --exclude-checks allow_header_conformance,positive_data_acceptance --phases examples,coverage,fuzzing
      - uses: grafana/setup-k6-action@v1
      - name: K6 smoke
        run: k6 run qa/k6/smoke.js
      - name: Restart API with production docs policy for ZAP
        working-directory: backend
        run: |
          kill "$(cat /tmp/enter-ai-api.pid)"
          for attempt in $(seq 1 30); do ! curl -sS http://127.0.0.1:8000/health >/dev/null 2>&1 && break || sleep 1; done
          ENVIRONMENT=production ENABLE_API_DOCS=false DATABASE_URL=sqlite:///./ci.db JWT_SECRET=ci-only-secret-that-is-long-enough-for-the-production-check REDIS_URL=redis://127.0.0.1:6379/0 SEED_ADMIN_PASSWORD=ci-only-seed-admin-password EMAIL_PROVIDER=smtp SMTP_HOST=127.0.0.1 EMAIL_FROM=ci@enterai.test APP_BASE_URL=http://127.0.0.1:3000 AUTH_LOGIN_RATE_LIMIT_PER_MINUTE=100000 AUTH_SIGNUP_RATE_LIMIT_PER_MINUTE=100000 AUTH_RECOVERY_RATE_LIMIT_PER_MINUTE=100000 AUTH_TOKEN_RATE_LIMIT_PER_MINUTE=100000 PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/enter-ai-api-zap.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8000/health || { echo "::error::API failed to come back up in production mode"; cat /tmp/enter-ai-api-zap.log; exit 1; }
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8000/
          cmd_options: -c /zap/wrk/qa/zap-rules.conf
          fail_action: true
          allow_issue_writing: false

  # Everything here passes trivially on one replica. This job is the only place the
  # shared-state work (Redis limits, advisory locks, object storage) is actually
  # exercised the way production runs it.
  multi-replica:
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres]
    env:
      POSTGRES_DB: enterai
      POSTGRES_USER: enterai
      POSTGRES_PASSWORD: enterai_ci_password
      DATABASE_URL: postgresql+psycopg://enterai:enterai_ci_password@db:5432/enterai
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-the-production-check
      SEED_ADMIN_EMAIL: admin@ci.enterai.test
      SEED_ADMIN_PASSWORD: ci-only-seed-admin-password
      STORAGE_BUCKET: enterai-uploads
      STORAGE_ACCESS_KEY: enterai_minio_ci
      STORAGE_SECRET_KEY: enterai_minio_ci_password
      SMTP_HOST: 127.0.0.1
      EMAIL_FROM: ci@enterai.test
      APP_BASE_URL: http://127.0.0.1:3000
      AI_PLAN_RATE_LIMIT_PER_MINUTE: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Start two API replicas behind a load balancer
        # `up lb` pulls in the API replicas and their dependencies but not the web
        # image, which this job does not exercise.
        run: docker compose -f docker-compose.prod.yml up -d --build lb
      - name: Wait for the load balancer
        run: |
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
          curl -fsS http://127.0.0.1:8000/health || { echo "::error::the stack never became reachable"; exit 1; }
      - name: Confirm both replicas are running
        run: |
          docker compose -f docker-compose.prod.yml ps
          running=$(docker compose -f docker-compose.prod.yml ps -q api | wc -l)
          test "$running" -eq 2 || { echo "::error::expected 2 running api replicas, found $running"; exit 1; }
      - name: Multi-replica checks
        run: python3 qa/multi_replica_check.py "$AI_PLAN_RATE_LIMIT_PER_MINUTE"
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: EnterAI
          path: .
          format: HTML
          args: --failOnCVSS 7
