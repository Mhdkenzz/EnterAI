name: Guarded Staging Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA to release (defaults to this workflow SHA)
        required: false
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: enterai-staging-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
          IMAGE_REPOSITORY: ${{ secrets.IMAGE_REPOSITORY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          STAGING_PUBLIC_API_URL: ${{ vars.STAGING_PUBLIC_API_URL }}
          STAGING_READINESS_URL: ${{ vars.STAGING_READINESS_URL }}
          STAGING_TERMS_URL: ${{ vars.STAGING_TERMS_URL }}
          STAGING_PRIVACY_URL: ${{ vars.STAGING_PRIVACY_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in IMAGE_REGISTRY IMAGE_REPOSITORY REGISTRY_USERNAME REGISTRY_PASSWORD DEPLOY_HOST DEPLOY_SSH_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH STAGING_PUBLIC_API_URL STAGING_READINESS_URL STAGING_TERMS_URL STAGING_PRIVACY_URL; do
            test -n "${!name}" || { echo "::error::Required staging setting $name is unset"; exit 1; }
          done
          case "$STAGING_PUBLIC_API_URL" in https://*) ;; *) echo "::error::STAGING_PUBLIC_API_URL must use HTTPS"; exit 1;; esac
          case "$STAGING_READINESS_URL" in https://*) ;; *) echo "::error::STAGING_READINESS_URL must use HTTPS"; exit 1;; esac
          case "$STAGING_TERMS_URL" in https://*) ;; *) echo "::error::STAGING_TERMS_URL must use HTTPS"; exit 1;; esac
          case "$STAGING_PRIVACY_URL" in https://*) ;; *) echo "::error::STAGING_PRIVACY_URL must use HTTPS"; exit 1;; esac
          case "$DEPLOY_PATH" in /*[!A-Za-z0-9._/-]*|/|"") echo "::error::DEPLOY_PATH must be a safe absolute path"; exit 1;; esac
          ref="${REQUESTED_REF:-$WORKFLOW_SHA}"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full 40-character lowercase SHA"
            exit 1
          fi
          # Never build or deploy a SHA whose required CI gates have not passed.
          # The check-runs endpoint is keyed by the exact commit, so a green run
          # for another branch or an earlier commit cannot satisfy this gate.
          checks_json=$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$ref/check-runs?per_page=100")
          required_checks=(backend backend-postgres frontend browser api-security-and-load multi-replica container-validation security-scans)
          for check in "${required_checks[@]}"; do
            if ! jq -e --arg name "$check" \
              '[.check_runs[] | select(.name == $name and .app.slug == "github-actions" and .status == "completed" and .conclusion == "success")] | length > 0' \
              <<<"$checks_json" >/dev/null; then
              echo "::error::Required CI check '$check' is not successful for $ref"
              exit 1
            fi
          done
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: preflight
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - name: Verify checkout is the requested immutable SHA
        env:
          REF: ${{ needs.preflight.outputs.ref }}
        run: test "$(git rev-parse HEAD)" = "$REF"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and publish exact-SHA images
        id: images
        env:
          REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
          REPOSITORY: ${{ secrets.IMAGE_REPOSITORY }}
          REF: ${{ needs.preflight.outputs.ref }}
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_PUBLIC_API_URL }}
          NEXT_PUBLIC_TERMS_URL: ${{ vars.STAGING_TERMS_URL }}
          NEXT_PUBLIC_PRIVACY_URL: ${{ vars.STAGING_PRIVACY_URL }}
          LOCAL_EMBEDDINGS: ${{ vars.STAGING_LOCAL_EMBEDDINGS }}
        run: |
          set -euo pipefail
          backend="$REGISTRY/$REPOSITORY/backend:sha-$REF"
          frontend="$REGISTRY/$REPOSITORY/frontend:sha-$REF"
          docker buildx build --push --metadata-file backend.json --tag "$backend" \
            --build-arg LOCAL_EMBEDDINGS="${LOCAL_EMBEDDINGS:-false}" ./backend
          docker buildx build --push --metadata-file frontend.json --tag "$frontend" --build-arg BUILD_ENVIRONMENT=staging --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" --build-arg NEXT_PUBLIC_TERMS_URL="$NEXT_PUBLIC_TERMS_URL" --build-arg NEXT_PUBLIC_PRIVACY_URL="$NEXT_PUBLIC_PRIVACY_URL" ./frontend
          backend_digest=$(jq -r '."containerimage.digest"' backend.json)
          frontend_digest=$(jq -r '."containerimage.digest"' frontend.json)
          test "$backend_digest" != null && test "$frontend_digest" != null
          echo "backend_image=$REGISTRY/$REPOSITORY/backend@$backend_digest" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$REGISTRY/$REPOSITORY/frontend@$frontend_digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [preflight, build-and-push]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - name: Pin SSH host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Upload reviewed deployment bundle and immutable image references
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REF: ${{ needs.preflight.outputs.ref }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          STAGING_TERMS_URL: ${{ vars.STAGING_TERMS_URL }}
          STAGING_PRIVACY_URL: ${{ vars.STAGING_PRIVACY_URL }}
        run: |
          set -euo pipefail
          release="release-$REF"
          mkdir "$release"
          cp docker-compose.prod.yml "$release/"
          mkdir "$release/deploy" "$release/scripts"
          cp deploy/nginx.conf "$release/deploy/"
          cp scripts/backup.sh scripts/verify_staging_config.sh scripts/staging_smoke.sh "$release/scripts/"
          chmod 755 "$release/scripts/"*.sh
          printf 'ENTERAI_BACKEND_IMAGE=%s\nENTERAI_FRONTEND_IMAGE=%s\nRELEASE_SHA=%s\nTERMS_URL=%s\nPRIVACY_URL=%s\n' "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$REF" "$STAGING_TERMS_URL" "$STAGING_PRIVACY_URL" > "$release/images.env"
          tar -C "$release" -czf "$release.tgz" .
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_SSH_USER@$DEPLOY_HOST" "install -d -m 750 '$DEPLOY_PATH/releases/$REF'"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$release.tgz" "$DEPLOY_SSH_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$REF/release.tgz"
      - name: Pull, migrate once, then start staged replicas
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REF: ${{ needs.preflight.outputs.ref }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_SSH_USER@$DEPLOY_HOST" "bash -s -- '$DEPLOY_PATH' '$REF'" <<'REMOTE'
          set -euo pipefail
          path=$1; ref=$2; release="$path/releases/$ref"; project=enterai-staging
          tar -xzf "$release/release.tgz" -C "$release"
          cd "$release"
          test -r "$path/.env" || { echo 'missing host .env' >&2; exit 1; }
          # Replace, rather than append to, the release env file so a prior
          # release can never override the newly built digest references.
          install -m 600 images.env "$path/.env.release"
          trap 'rm -f "$path/.env.release"' EXIT
          compose=(docker compose -p "$project" -f docker-compose.prod.yml --env-file "$path/.env" --env-file "$path/.env.release")
          "${compose[@]}" pull
          # Pulling immutable artifacts is harmless; no service is created until
          # the host/TLS/config contract and the image's canonical validator pass.
          ./scripts/verify_staging_config.sh "$path/.env" "$path/.env.release"
          "${compose[@]}" up -d db redis objectstore objectstore-init
          "${compose[@]}" run --rm migrate
          "${compose[@]}" up -d --no-build --scale api=2 api web lb backup objectstore-backup
          for attempt in $(seq 1 30); do
            running_api=$("${compose[@]}" ps --status running -q api | wc -l)
            running_backup=$("${compose[@]}" ps --status running -q backup | wc -l)
            running_object_backup=$("${compose[@]}" ps --status running -q objectstore-backup | wc -l)
            if [ "$running_api" = 2 ] && [ "$running_backup" = 1 ] && [ "$running_object_backup" = 1 ]; then
              exit 0
            fi
            sleep 2
          done
          "${compose[@]}" ps
          echo 'expected two API replicas plus both backup services to be running' >&2
          exit 1
          REMOTE
      - name: Verify externally reachable readiness
        env:
          STAGING_READINESS_URL: ${{ vars.STAGING_READINESS_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do curl --fail --silent --show-error "$STAGING_READINESS_URL" && exit 0; sleep 5; done
          echo "::error::Staging did not become ready. Database rollback is deliberately manual."
          exit 1
      - name: Run public staging smoke checks
        env:
          STAGING_READINESS_URL: ${{ vars.STAGING_READINESS_URL }}
          STAGING_TERMS_URL: ${{ vars.STAGING_TERMS_URL }}
          STAGING_PRIVACY_URL: ${{ vars.STAGING_PRIVACY_URL }}
          STAGING_SMOKE_REQUIRE_LEGAL: "true"
          STAGING_SMOKE_REQUIRE_INVITE_ONLY: "true"
        run: |
          set -euo pipefail
          base_url="${STAGING_READINESS_URL%/ready}"
          scripts/staging_smoke.sh "$base_url"
