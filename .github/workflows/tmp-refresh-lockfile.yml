name: Temporary - refresh npm lockfile for CVE fixes

# One-off: bumps transitive sharp (GHSA-wq5f-xc86-pv6w) and source-map-js
# (CVE-2026-93749) in frontend/package-lock.json and commits the result back to
# this branch. Removed in the following commit.
on:
  push:
    branches: [security-audit-fixes]
    paths: [.github/workflows/tmp-refresh-lockfile.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: security-audit-fixes
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Update vulnerable transitive packages
        working-directory: frontend
        run: |
          npm update sharp source-map-js --package-lock-only --no-audit --no-fund
          node -e '
            const p = require("./package-lock.json").packages;
            const v = (k) => (p["node_modules/" + k] || {}).version;
            const lt = (a, b) => a.split(".").map(Number).reduce((r, x, i) => r !== 0 ? r : x - Number(b.split(".")[i]), 0) < 0;
            const bad = [["sharp", "0.35.5"], ["source-map-js", "1.2.2"]].filter(([k, min]) => !v(k) || lt(v(k), min));
            console.log("sharp", v("sharp"), "source-map-js", v("source-map-js"));
            if (bad.length) { console.log("::error::still vulnerable: " + JSON.stringify(bad.map(([k]) => [k, v(k)]))); process.exit(1); }
            console.log("::notice::lockfile now has sharp " + v("sharp") + ", source-map-js " + v("source-map-js"));
          '
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet && { echo "::error::lockfile unchanged"; exit 1; }
          git commit -m "Bump sharp and source-map-js in frontend lockfile (CVE fixes)"
          git push origin HEAD:security-audit-fixes
