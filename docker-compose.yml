services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterai}
      POSTGRES_USER: ${POSTGRES_USER:-enterai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enterai_dev_password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # A real SMTP server for development, so password reset, verification and invite
  # mail travels the same path it will in production. Captured mail is readable at
  # http://localhost:8025 instead of being delivered.
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]
  # S3-compatible object storage, so local development exercises the same storage
  # adapter production uses rather than a code path only dev ever runs.
  # (Versity S3 Gateway over a local directory; MinIO's images stopped being public.)
  objectstore:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    command: ["--port", ":9000", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-enterai_storage}
      ROOT_SECRET_KEY: ${STORAGE_SECRET_KEY:-enterai_storage_dev_password}
    ports: ["9000:9000"]
    volumes: [objectstore_data:/data]
  # Creates the bucket once, then exits; the API waits for it to finish.
  objectstore-init:
    build: ./backend
    command: ["python", "-m", "app.ensure_bucket"]
    depends_on: [objectstore]
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-enterai-uploads}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://objectstore:9000}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-enterai_storage}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-enterai_storage_dev_password}
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://enterai:enterai_dev_password@db:5432/enterai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@enterai.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-enterai-uploads}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://objectstore:9000}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-enterai_storage}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-enterai_storage_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:1234/v1}
      AI_MODEL: ${AI_MODEL:-local-model}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
    ports: ["8000:8000"]
    volumes: [./backend:/app, uploads:/app/uploads]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
      objectstore-init: {condition: service_completed_successfully}
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  objectstore_data:
  uploads:
