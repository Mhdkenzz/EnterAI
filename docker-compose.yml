services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterai}
      POSTGRES_USER: ${POSTGRES_USER:-enterai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enterai_dev_password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # S3-compatible object storage, so local development exercises the same storage
  # adapter production uses rather than a code path only dev ever runs.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-enterai_minio}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-enterai_minio_dev_password}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  # Creates the bucket once, then exits; the API waits for it to finish. Readiness
  # is decided by this retry loop rather than a healthcheck on the server, because
  # `mc` is guaranteed present here and the server image's tooling is not.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-enterai-uploads}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-enterai_minio}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-enterai_minio_dev_password}
    entrypoint: >-
      sh -c "until mc alias set local http://minio:9000 $$STORAGE_ACCESS_KEY $$STORAGE_SECRET_KEY;
             do echo 'waiting for minio'; sleep 2; done &&
             mc mb --ignore-existing local/$$STORAGE_BUCKET"
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://enterai:enterai_dev_password@db:5432/enterai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-enterai-uploads}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-enterai_minio}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-enterai_minio_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:1234/v1}
      AI_MODEL: ${AI_MODEL:-local-model}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
    ports: ["8000:8000"]
    volumes: [./backend:/app, uploads:/app/uploads]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  minio_data:
  uploads:
