events {}

http {
  # Docker's embedded DNS round-robins the `api` name across replicas, but nginx
  # resolves a literal upstream once at startup and would pin itself to whichever
  # replica answered first. Resolving through a variable forces a fresh lookup, so
  # traffic actually spreads.
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /api/ {
      set $api http://api:8000;
      proxy_pass $api$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_http_version 1.1;
      # Deliberately no upstream identifier in the response: which replica served a
      # request is useful internally but is topology information clients do not
      # need. Checks that care read it from the replicas' own access logs instead.
    }

    location = /live { set $api http://api:8000; proxy_pass $api$request_uri; proxy_set_header Host $host; }
    location = /ready { set $api http://api:8000; proxy_pass $api$request_uri; proxy_set_header Host $host; }
    location = /health { set $api http://api:8000; proxy_pass $api$request_uri; proxy_set_header Host $host; }

    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_http_version 1.1;
    }
  }
}
