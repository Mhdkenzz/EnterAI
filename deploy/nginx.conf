events {}

http {
  # Docker's embedded DNS round-robins the `api` name across replicas, but nginx
  # resolves a literal upstream once at startup and would pin itself to whichever
  # replica answered first. Resolving through a variable forces a fresh lookup, so
  # traffic actually spreads.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8000;

    location / {
      set $api http://api:8000;
      proxy_pass $api$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Deliberately no upstream identifier in the response: which replica served a
      # request is useful internally but is topology information clients do not
      # need. Checks that care read it from the replicas' own access logs instead.
    }
  }
}
